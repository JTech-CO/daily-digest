<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>daily-digest</title>
  <meta name="description" content="Hacker News · GeekNews · arXiv · Phys.org · TechXplore 5개 소스 한국어 큐레이션">
  <!-- 공유 카드(OG · Twitter). 이미지는 images/에서 빌드 시 public/images/로 복사된다. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="daily-digest">
  <meta property="og:title" content="daily-digest">
  <meta property="og:description" content="매일 5개 기술·과학 소스에서 하나씩, 한국어로">
  <meta property="og:url" content="https://jtech-co.github.io/daily-digest/">
  <meta property="og:image" content="https://jtech-co.github.io/daily-digest/images/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="daily-digest: 매일 5개 기술·과학 소스에서 하나씩, 한국어로">
  <meta name="twitter:card" content="summary_large_image">
  <!-- 방어 계층(BYOK 사이트). 스크립트는 자기 출처만, 연결은 data.json과 4개 LLM 프로바이더로 제한.
       GitHub Pages는 응답 헤더를 못 붙이므로 meta로 선언한다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
  <link rel="alternate" type="application/atom+xml" title="daily-digest (Atom)" href="feed.xml">
  <link rel="alternate" type="application/feed+json" title="daily-digest (JSON Feed)" href="feed.json">
  <!-- FOUC 방지: 저장된 테마를 렌더 전에 적용(외부 파일, CSP script-src 'self') -->
  <script src="theme-init.js"></script>
</head>
<body>
  <header class="statusline">
    <span class="statusline__name">daily-digest</span>
    <nav class="statusline__nav">
      <button id="prevDate" class="datenav__btn" aria-label="이전 날짜">‹</button>
      <time id="currentDate" class="datenav__date"></time>
      <button id="nextDate" class="datenav__btn" aria-label="다음 날짜">›</button>
    </nav>
    <div class="statusline__actions">
      <button id="themeToggle" class="toggle" role="switch" aria-label="다크/라이트 전환">
        <span class="toggle__track"><span class="toggle__knob"></span></span>
      </button>
    </div>
  </header>

  <div class="searchbar">
    <input id="search" class="searchbar__input" type="search" autocomplete="off"
           placeholder="제목·요약 검색 (원문/번역 모두)" aria-label="검색">
    <div class="searchbar__chips" id="sourceChips" role="group" aria-label="소스 필터"></div>
  </div>

  <main class="feed" id="feed" aria-live="polite"></main>

  <!-- 아카이브: 날짜가 수백 개까지 늘어나므로 기본은 접어두고, 월별로 나눠 4열 그리드로 보인다. -->
  <section class="archive" id="archive" hidden>
    <h2 class="archive__title">
      <button class="archive__toggle" id="archiveToggle" aria-expanded="false" aria-controls="archiveBody">
        <span class="archive__caret" aria-hidden="true">▸</span>
        아카이브
        <span class="archive__total" id="archiveTotal"></span>
      </button>
    </h2>
    <div class="archive__body" id="archiveBody" hidden>
      <div class="archive__months" id="archiveMonths" role="group" aria-label="월 선택"></div>
      <ul class="archive__grid" id="archiveList"></ul>
    </div>
  </section>

  <footer class="pagefoot">
    <span id="foot"></span>
  </footer>

  <!-- 상세 뷰: 제목/패널 클릭 시 열림. 소스 카테고리 색이 강조된다. -->
  <div class="detail" id="detail" hidden>
    <div class="detail__backdrop" data-close></div>
    <div class="detail__panel" role="dialog" aria-modal="true" aria-labelledby="detailTitle" style="--cat: var(--border)">
      <header class="detail__head">
        <div class="detail__meta">
          <span class="detail__badge" id="detailBadge"></span>
          <span class="detail__signal" id="detailSignal"></span>
        </div>
        <button class="detail__close" id="detailClose" aria-label="닫기">✕</button>
      </header>
      <h2 class="detail__title" id="detailTitle"></h2>
      <p class="detail__orig" id="detailOrig"></p>
      <a class="detail__source" id="detailSource" target="_blank" rel="noopener noreferrer">원문 보기 ↗</a>

      <div class="detail__body" id="detailBody"></div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>

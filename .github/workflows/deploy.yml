name: deploy

# 프론트엔드·정적 자산만 바뀐 푸시는 수집 없이 곧바로 배포한다.
#
# 왜 별도인가: daily.yml은 하루 1회 수집부터 다시 하므로, 코드만 고친 날
# 그걸 돌리면 그날의 5건이 아침과 다른 기사로 바뀐다. 그렇다고 안 돌리면
# 사이트가 최대 24시간 옛 버전으로 남는다. 이 워크플로는 저장된 DB를 그대로
# 두고 정적 사이트만 다시 만들어, 기사는 건드리지 않고 화면만 갱신한다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'                          # 프론트엔드 소스
      - 'images/**'                       # OG 이미지 등 정적 자산
      - 'src/web/**'                      # 빌드·피드 생성기
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}                   # 수집 없이 현재 DB로 재배포

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read                      # DB는 읽기만 한다(커밋은 daily.yml 몫)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # daily.yml의 deploy 잡과 같은 큐 — Pages 배포가 겹치지 않도록
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # 수집·번역 없이 저장된 DB로 public/만 다시 만든다
      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4

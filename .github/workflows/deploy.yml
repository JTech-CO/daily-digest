name: deploy

# 프론트엔드·정적 자산만 바뀐 푸시는 수집 없이 곧바로 배포한다.
#
# 왜 별도인가: daily.yml은 하루 1회 수집부터 다시 하므로, 코드만 고친 날
# 그걸 돌리면 그날의 5건이 아침과 다른 기사로 바뀐다. 그렇다고 안 돌리면
# 사이트가 최대 24시간 옛 버전으로 남는다. 이 워크플로는 저장된 DB를 그대로
# 두고 정적 사이트만 다시 만들어, 기사는 건드리지 않고 화면만 갱신한다.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'                          # 프론트엔드 소스
      - 'images/**'                       # OG 이미지 등 정적 자산
      - 'src/web/**'                      # 빌드·피드 생성기
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}                   # 수집 없이 현재 DB로 재배포

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read                      # DB는 읽기만 한다(커밋은 daily.yml 몫)
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # daily.yml의 deploy 잡과 같은 큐. Pages 배포가 겹치지 않도록
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # 수집·번역 없이 저장된 DB로 public/만 다시 만든다
      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
